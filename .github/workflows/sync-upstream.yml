name: Sync with upstream

on:
  schedule:
    # Run every day at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to sync"
        required: false
        default: "master"

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: navidrome/navidrome
      BRANCH: ${{ github.event.inputs.branch || 'master' }}
      NOTIFY_USER: filipton
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${BRANCH}"

      - name: Check if sync is needed
        id: check
        run: |
          LOCAL_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse upstream/${BRANCH})
          echo "local_sha=${LOCAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "${UPSTREAM_SHA}" "${LOCAL_SHA}"; then
            echo "Already up to date with upstream."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt fast-forward / clean merge
        if: steps.check.outputs.needs_sync == 'true'
        id: merge
        run: |
          set +e
          git merge --no-edit --ff "upstream/${BRANCH}"
          FF_STATUS=$?
          if [ $FF_STATUS -eq 0 ]; then
            echo "result=fast_forward" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --abort 2>/dev/null || true
          git merge --no-edit --no-ff "upstream/${BRANCH}"
          MERGE_STATUS=$?
          if [ $MERGE_STATUS -eq 0 ]; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Merge failed due to conflicts."
          git merge --abort 2>/dev/null || true
          echo "result=conflict" >> "$GITHUB_OUTPUT"

      - name: Detect workflow file changes
        if: steps.check.outputs.needs_sync == 'true' && (steps.merge.outputs.result == 'fast_forward' || steps.merge.outputs.result == 'merged')
        id: workflow_changes
        run: |
          CHANGED=$(git diff --name-only "${{ steps.check.outputs.local_sha }}" HEAD -- '.github/workflows/' || true)
          if [ -n "${CHANGED}" ]; then
            echo "has_workflow_changes=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed_files<<EOF"
              echo "${CHANGED}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_workflow_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge to ${{ env.BRANCH }}
        if: steps.check.outputs.needs_sync == 'true' && (steps.merge.outputs.result == 'fast_forward' || steps.merge.outputs.result == 'merged') && steps.workflow_changes.outputs.has_workflow_changes != 'true'
        id: push
        run: |
          git push origin "${BRANCH}"
          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Collect conflict files
        if: steps.merge.outputs.result == 'conflict'
        id: conflicts
        run: |
          git merge --no-commit "upstream/${BRANCH}" 2>/dev/null || true
          FILES=$(git diff --name-only --diff-filter=U || true)
          git merge --abort 2>/dev/null || true
          {
            echo "files<<EOF"
            echo "${FILES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify manual sync required
        if: >-
          steps.merge.outputs.result == 'conflict' ||
          steps.workflow_changes.outputs.has_workflow_changes == 'true' ||
          (steps.push.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REASON=""
          DETAILS=""

          if [ "${{ steps.merge.outputs.result }}" = "conflict" ]; then
            REASON="merge conflicts"
            DETAILS="Conflicting files:
          \`\`\`
          ${{ steps.conflicts.outputs.files }}
          \`\`\`"
          elif [ "${{ steps.workflow_changes.outputs.has_workflow_changes }}" = "true" ]; then
            REASON="workflow file changes (GITHUB_TOKEN lacks \`workflows\` permission)"
            DETAILS="Changed workflow files:
          \`\`\`
          ${{ steps.workflow_changes.outputs.changed_files }}
          \`\`\`"
          else
            REASON="push failed"
            DETAILS="The merge succeeded locally but could not be pushed to origin."
          fi

          TITLE="Upstream sync required: ${UPSTREAM_REPO}@${BRANCH}"
          BODY=$(cat <<EOF
          @${NOTIFY_USER} — automated upstream sync could not complete.

          **Reason:** ${REASON}

          **Upstream SHA:** \`${{ steps.check.outputs.upstream_sha }}\`
          **Local SHA:** \`${{ steps.check.outputs.local_sha }}\`

          ${DETAILS}

          To sync manually:

          \`\`\`bash
          git fetch upstream ${BRANCH}
          git checkout ${BRANCH}
          git merge upstream/${BRANCH}
          # resolve any conflicts, then:
          git push origin ${BRANCH}
          \`\`\`

          _Created by the [Sync with upstream](${{ github.server_url }}/${{ github.repository }}/actions/workflows/sync-upstream.yml) workflow._
          EOF
          )

          EXISTING=$(gh issue list --search "Upstream sync required in:title repo:${{ github.repository }}" --state open --json number --jq '.[0].number' || true)
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh label create upstream-sync --color d4c5f9 --description "Automated upstream sync needs manual intervention" 2>/dev/null || true
            if gh issue create \
              --title "${TITLE}" \
              --body "${BODY}" \
              --label upstream-sync \
              --assignee "${NOTIFY_USER}" 2>/dev/null; then
              :
            else
              gh issue create --title "${TITLE}" --body "${BODY}"
            fi
          fi

          exit 1
