name: Sync with upstream

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork branch
        id: sync
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        # The push made with UPSTREAM_SYNC_TOKEN triggers fork-pipeline.yml on its own
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=master --jq .merge_type
