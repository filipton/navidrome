name: Sync with upstream

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: upstream-sync-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork branch
        id: sync
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          merge_type=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=master --jq .merge_type)
          echo "merge_type=${merge_type}" >> "$GITHUB_OUTPUT"

      - name: Test and publish updated branch
        if: steps.sync.outputs.merge_type != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fork-pipeline.yml --ref master
